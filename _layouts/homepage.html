<!doctype html>
<html lang="en" data-language="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ page.excerpt | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:description" content="{{ page.excerpt | escape }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/images/profile.jpg">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="{{ site.baseurl }}/images/favicon.ico?v=portrait">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32x32.png?v=portrait">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/images/apple-touch-icon-180x180.png?v=portrait">
    <link rel="manifest" href="{{ site.baseurl }}/images/manifest.json">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/homepage.css">
    <script src="{{ site.baseurl }}/assets/js/homepage-language.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main"><span data-lang="en">Skip to content</span><span data-lang="zh" lang="zh-CN">跳转到正文</span></a>
    <header class="masthead">
      <nav class="masthead__inner-wrap" aria-label="Main navigation">
        <a class="nav-home" href="#about-me"><span data-lang="en">Homepage</span><span data-lang="zh" lang="zh-CN">主页</span></a>
        <a href="#internships"><span data-lang="en">Internships</span><span data-lang="zh" lang="zh-CN">实习经历</span></a>
        <a href="#publications"><span data-lang="en">Publications</span><span data-lang="zh" lang="zh-CN">代表论文</span></a>
        <a href="#education"><span data-lang="en">Education</span><span data-lang="zh" lang="zh-CN">教育经历</span></a>
        <button id="language-toggle" class="language-toggle" type="button" aria-label="切换到中文" hidden>中文</button>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <aside class="sidebar" aria-label="Profile">
        <div class="profile-box">
          <a class="author__avatar" href="{{ site.baseurl }}/images/profile.jpg" aria-label="View portrait of Peiru Yang">
            <img src="{{ site.baseurl }}/images/profile.jpg" width="175" height="175" alt="Peiru Yang / 杨珮茹">
          </a>
          <div class="author__content">
            <h1 class="author__name">Peiru Yang <span class="author__name-cn" lang="zh-CN">杨珮茹</span></h1>
            <p class="author__bio"><span data-lang="en">{{ site.author.bio }}</span><span data-lang="zh" lang="zh-CN">清华大学博士生，研究 LLM pre-training，关注 Scaling Laws、Scaling ladder 和 Data strategy。</span></p>
            <p class="author__affiliation"><span data-lang="en">Beijing, China</span><span data-lang="zh" lang="zh-CN">中国，北京</span></p>
            <ul class="author__urls">
              <li><a href="mailto:{{ site.author.email }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="m3 6 9 7 9-7"></path></svg><span data-lang="en">Email</span><span data-lang="zh" lang="zh-CN">邮箱</span></a></li>
              <li><a href="{{ site.author.googlescholar }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m2 9 10-5 10 5-10 5L2 9Z"></path><path d="M6 11v6c1.6 1.5 3.6 2.2 6 2.2s4.4-.7 6-2.2v-6M22 9v7"></path></svg><span>Google Scholar</span></a></li>
              <li><a href="https://github.com/{{ site.author.github }}"><svg class="icon-github" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.57.1.77-.25.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.66 1.23 3.31.94.1-.74.39-1.24.7-1.52-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.43.11-2.99 0 0 .95-.3 3.1 1.16A10.8 10.8 0 0 1 12 6.35c.96 0 1.93.13 2.83.38 2.15-1.46 3.1-1.16 3.1-1.16.61 1.56.23 2.71.11 2.99.72.79 1.16 1.8 1.16 3.03 0 4.32-2.64 5.28-5.15 5.56.4.35.75 1.03.75 2.08v3.1c0 .29.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"></path></svg><span>GitHub</span></a></li>
            </ul>
          </div>
        </div>
      </aside>
      <article class="page">
        {{ content }}
      </article>
    </main>
  </body>
</html>
