en:
  intro: >-
    I am a Ph.D. candidate in the Department of Electronic Engineering at <a href="https://www.tsinghua.edu.cn/en/"><strong>Tsinghua University</strong></a>. I received my B.E. degree from Tsinghua University in 2021.
  research: >-
    My research focuses on <strong>LLM pre-training</strong>, specifically <strong>scaling law</strong> and <strong>data strategy</strong>. I am particularly interested in building <strong>scaling ladders</strong>, understanding the effects of <strong>multi-epoch</strong> data reuse, and optimizing <strong>data mixture</strong> ratios. My work has been published at conferences including ICML, NeurIPS, ACL, AAAI, and EMNLP.
  current: >-
    I am currently a research intern on the Scaling Team at <a href="https://www.moonshot.ai/">Moonshot AI</a>. Previously, I worked at <a href="https://hunyuan.tencent.com/">Tencent Hunyuan</a> and <a href="https://studio.dots.ai/?lang=en">Xiaohongshu Dots</a>.
zh:
  intro: >-
    我目前在<a href="https://www.tsinghua.edu.cn/"><strong>清华大学</strong></a>电子工程系攻读博士学位，于 2021 年获得清华大学工学学士学位。
  research: >-
    我的主要研究方向是 <strong>LLM pre-training</strong>，具体包括 <strong>scaling law</strong> 和 <strong>data strategy</strong>。我尤其关注 <strong>scaling ladder</strong> 的搭建、预训练阶段 <strong>multi-epoch</strong> 的影响，以及预训练数据配比与合版。我的研究成果已发表于 ICML、NeurIPS、ACL、AAAI、EMNLP 等会议。
  current: >-
    目前，我在 <a href="https://www.moonshot.ai/">Moonshot AI</a> 的 Scaling Team 实习；此前曾在<a href="https://hunyuan.tencent.com/">腾讯混元</a>和<a href="https://studio.dots.ai/?lang=en">小红书 Dots</a>实习。
